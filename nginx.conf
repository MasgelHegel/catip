server {
    listen 80;
    listen [::]:80;
    server_name catip.example.com;  # Ganti dengan domain kamu

    # Redirect semua HTTP ke HTTPS (aktifkan setelah SSL terpasang)
    # return 301 https://$host$request_uri;

    root /var/www/catip;
    index index.html;

    # ── Gzip Compression ──────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ── SPA Routing — semua request ke index.html ─────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Cache static assets lama (JS/CSS di-hash oleh Vite) ───────
    location ~* \.(?:js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Cache gambar ──────────────────────────────────────────────
    location ~* \.(?:png|webp|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Security Headers ──────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

